<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- WPS 专用配置: 屏蔽部分字体, 仅通过 FONTCONFIG_FILE 对 WPS 生效 -->
  <!-- 只需 include 系统主配置, 用户配置也会被包含 -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <selectfont>
    <rejectfont>
      <glob>/usr/share/fonts/noto/*</glob>
      <glob>/usr/share/fonts/noto-cjk/*</glob>
      <glob>/usr/share/fonts/maple/*</glob>
      <glob>/usr/share/fonts/sarasa-gothic/*</glob>
      <glob>/usr/share/fonts/TTF/Iosevka-*</glob>
    </rejectfont>
    <acceptfont>
      <!-- 只留 Regular+Bold (WPS会合并为一项). 其他字重会单独列出导致列表膨胀 -->
      <!-- 豁免通用 Noto: 核心文字/emoji/符号/数学 -->
      <glob>/usr/share/fonts/noto/NotoColorEmoji.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansMath-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSans-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSans-Bold.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSerif-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSerif-Bold.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSerifDisplay-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSerifDisplay-Bold.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansMono-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansMono-Bold.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansSymbols-Regular.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansSymbols-Bold.ttf</glob>
      <glob>/usr/share/fonts/noto/NotoSansSymbols2-Regular.ttf</glob>
      <!-- 豁免 Noto Sans/Serif CJK -->
      <glob>/usr/share/fonts/noto-cjk/Noto*CJK-Regular.ttc</glob>
      <glob>/usr/share/fonts/noto-cjk/Noto*CJK-Bold.ttc</glob>
    </acceptfont>
  </selectfont>
</fontconfig>
