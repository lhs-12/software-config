[tools]
aube      = "latest"
usage     = "latest"
pitchfork = "latest"
gh        = "latest"
typst     = "latest"

# Windows PI 需要在 ~/.pi/agent/settings.json 配置 Shell: bash 更实用, pwsh 兼容性更好
# shellPath 影响 !/!! 命令和 bash tool 的 shell; powershell tool 从 PATH 找 pwsh, 不读 shellPath
# WSL 的 bash.exe PATH 优先级比 MSYS2 Bash 高, 所以需要显式指定 shellPath
# defaultTools 配置不建议混用 Bash 和 PowerShell, 因为混用规则不够明确, 行为不可控
#
# 仅用 Bash 配置
# "shellPath": "C:/msys64/usr/bin/bash.exe"
# 仅用 Pwsh 配置
# "shellPath": "C:/Program Files/PowerShell/7/pwsh.exe"
# "defaultTools": ["read", "powershell", "edit", "write"]
pi = "latest"
"npm:skills" = "latest"
"npm:@deepseek-ai/dsh" = "latest"
"github:can1357/oh-my-pi" = "latest"

"npm:@dbx-app/cli" = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"

rust = "stable"
cargo-binstall = "latest"
java   = ["lts", "temurin-8"]
maven  = "3.9.16" # 固定具体版本: Windows mise 版本别名(3/latest)是文本文件非软链接
node   = "lts"
uv     = "latest"
ruff   = "latest"
stylua = "latest"
oxfmt  = "latest"
oxlint = "latest"

[settings]
github.credential_command = "gh auth token"
minimum_release_age = "0s"
upgrade.prune_after = "0s"
idiomatic_version_file_enable_tools = ["java", "node", "pnpm", "rust"]
rust.default_host = "x86_64-pc-windows-gnu" # 默认编译目标设为 GNU, 省去安装 Visual Studio Build Tools
