[tools]
aube      = "latest"
usage     = "latest"
pitchfork = "latest"
gh        = "latest"
typst     = "latest"

herdr = "latest"
pi = "latest"
"npm:skills" = "latest"
"npm:@deepseek-ai/dsh" = "latest"
"github:can1357/oh-my-pi" = "latest"

"npm:@dbx-app/cli" = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"

rust = "stable"
cargo-binstall = "latest"
java   = ["lts", "temurin-8"]
maven  = "3"
node   = "lts"
uv     = "latest"
ruff   = "latest"
stylua = "latest"
oxfmt  = "latest"
oxlint = "latest"

[settings]
github.credential_command = "gh auth token"
minimum_release_age = "0s"
upgrade.prune_after = "0s"
idiomatic_version_file_enable_tools = ["java", "node", "pnpm", "rust"]
